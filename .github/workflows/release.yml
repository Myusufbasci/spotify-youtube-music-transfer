name: Build Standalone Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build single-file Windows .exe
        run: |
          pyinstaller --noconfirm --onefile --collect-data ytmusicapi --collect-data playwright --name "Spotify-YouTube-Music-Transfer" app.py

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spotify-YouTube-Music-Transfer-Windows-x64
          path: dist/Spotify-YouTube-Music-Transfer.exe

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Spotify-YouTube-Music-Transfer.exe
